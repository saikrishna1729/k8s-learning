# Fluent Bit Helm Values
# Install with: helm install fluent-bit fluent/fluent-bit -f fluentbit-values.yaml -n logging

# Global Fluent Bit config
config:
  # Service section: main Fluent Bit settings
  service: |
    [SERVICE]
        Daemon Off
        Flush 1
        Log_Level info
        Parsers_File parsers.conf
        Parsers_File custom_parsers.conf
        HTTP_Server On
        HTTP_Listen 0.0.0.0
        HTTP_Port 2020
        Health_Check On

  # Input plugins (sources of logs)
  inputs: |
    [INPUT]
        Name tail
        Path /var/log/containers/*.log
        Parser docker
        Tag kube.*
        Refresh_Interval 5
        Mem_Buf_Limit 50MB
        Skip_Long_Lines On

  # Filter plugins (process/enrich logs)
  filters: |
    [FILTER]
        Name kubernetes
        Match kube.*
        Kube_URL https://kubernetes.default.svc:443
        Kube_CA_File /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File /var/run/secrets/kubernetes.io/serviceaccount/token
        Kube_Tag_Prefix kube.var.log.containers.
        Merge_Log On
        Keep_Log Off
        K8S-Logging.Parser On
        K8S-Logging.Exclude On

  # Output plugins (destinations for logs)
  outputs: |
    [OUTPUT]
        Name stdout
        Match *

    # Uncomment to send to Elasticsearch
    # [OUTPUT]
    #     Name es
    #     Match kube.*
    #     Host elasticsearch.default.svc.cluster.local
    #     Port 9200
    #     HTTP_User elastic
    #     HTTP_Passwd changeme
    #     Logstash_Format On
    #     Logstash_Prefix k8s
    #     Retry_Limit False

    # Or send to CloudWatch (AWS)
    # [OUTPUT]
    #     Name cloudwatch_logs
    #     Match kube.*
    #     region us-west-2
    #     log_group_name /aws/eks/my-cluster/logs
    #     log_stream_prefix kube-
    #     auto_create_group true

# Pod tolerations (to run on all nodes, including master)
tolerations:
- key: node-role.kubernetes.io/master
  operator: Exists
  effect: NoSchedule
- key: node-role.kubernetes.io/control-plane
  operator: Exists
  effect: NoSchedule

# Resources
resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 64Mi

# DaemonSet settings
hostNetwork: false
dnsPolicy: ClusterFirst

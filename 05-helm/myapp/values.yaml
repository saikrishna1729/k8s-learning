replicaCount: 1
image:
  repository: nginx
  tag: "1.25"
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 80
  targetPort: 80
ingress:
  enabled: false
  className: nginx
  host: myapp.local
  tls: false
resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "200m"
    memory: "256Mi"
config:
  logLevel: info
  maxConnections: 100
  dbHost: postgres-service
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
postgresql:
  enabled: false
  auth:
    database: myappdb
    username: myapp
